<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEEL-AI | Premium Pairing</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #ff0000;
            --dark-red: #4a0000;
            --accent-gold: #ffd700;
            --bg-black: #0a0a0a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(to bottom, var(--dark-red), var(--bg-black));
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 450px; text-align: center; }

        .logo-area { margin-bottom: 30px; }
        .logo-area i { font-size: 50px; color: var(--accent-gold); margin-bottom: 10px; }
        .logo-area h1 { font-weight: 900; letter-spacing: 2px; color: var(--primary-red); }

        /* Server Selection Style */
        .server-container {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--primary-red);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .server-option {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .server-option.active { border-color: var(--accent-gold); background: #2a0000; }
        .server-option span { color: var(--accent-gold); font-size: 0.9rem; }

        .input-box {
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid var(--primary-red);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--accent-gold);
            color: white;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(45deg, var(--primary-red), #ff5555);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .result-box {
            margin-top: 20px;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed var(--accent-gold);
            display: none;
        }

        .pairing-code {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent-gold);
            letter-spacing: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">
            <i class="fas fa-crown"></i>
            <h1>ADEEL-AI</h1>
            <p>Premium Pairing Code Generator</p>
        </div>

        <div class="server-container">
            <h3 style="color: var(--accent-gold); margin-bottom: 15px;"><i class="fas fa-bolt"></i> Select a Server</h3>
            <div class="server-option active" onclick="selectServer(this, 'https://adeel-mini-c947a70d0ed8.herokuapp.com/code')">
                <div>Server 1</div> <span id="s1-status">Click to select</span>
            </div>
            <div class="server-option" onclick="selectServer(this, 'https://adeel-mini-c6uuy7a70d0ed8.herokuapp.com/code')">
                <div>Server 2</div> <span id="s2-status">Click to select</span>
            </div>
            <div class="server-option" onclick="selectServer(this, 'https://adeel-mini-c947a70e900d8.herokuapp.com/code')">
                <div>Server 3</div> <span id="s3-status">Click to select</span>
            </div>
        </div>

        <div class="input-box">
            <p style="font-size: 0.9rem; margin-bottom: 10px;">Enter WhatsApp Number</p>
            <input type="tel" id="phoneNumber" placeholder="923035512967">
            <button class="btn-generate" onclick="generateCode()">Generate Pair Code</button>
        </div>

        <div class="result-box" id="resultBox">
            <p style="color: #888;">Your pairing code will appear here</p>
            <div class="pairing-code" id="pairCode">--------</div>
            <button onclick="copyCode()" style="background:none; border:1px solid #555; color:white; padding:5px 15px; border-radius:5px; margin-top:10px; cursor:pointer;">Copy</button>
        </div>

        <p style="font-size: 0.7rem; color: #666; margin-top: 30px;">© 2026 ADEEL-AI | Powered By DEVELOPER</p>
    </div>

    <script src="pair.js"></script>
</body>
</html>
